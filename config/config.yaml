wechat:
  path: C:\Program Files\Tencent\Weixin
  auto_reply: true
  reply_delay:
  - 1
  - 3
  max_message_length: 500
ai:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.8
  max_context_messages: 500
personality:
  config_file: config/persona.yaml
filters:
  whitelist: []
  blacklist: []
  keywords_filter: []
logging:
  level: DEBUG
  file: logs/ailive.log
  rotation: 100 MB
  retention: 30 days
storage:
  conversations_dir: data/conversations
  cache_dir: data/cache

# 主动对话配置
proactive_chat:
  enabled: false             # 是否启用主动对话（已关闭）
  idle_time: 3600            # 闲置多久后主动聊天（秒），默认1小时
  min_interval: 1800         # 最小间隔时间（秒），默认30分钟
  max_daily_proactive: 3     # 每天最多主动几次

# 群聊唤醒配置
group_chat:
  enabled: true                        # 是否启用群聊功能
  end_session_keyword: "结束本次会话"   # 结束会话关键词
  end_session_reply: "我跟刘狗日批去了，如需唤醒请艾特我的名字。"  # 结束语
  test_group: ""                       # 测试群名称（留空则对所有群生效）
  admins_file: "data/group_admins.json"  # 群管理员存储文件

