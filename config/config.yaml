wechat:
  path: C:\Program Files\Tencent\Weixin
  auto_reply: true
  reply_delay:
  - 1
  - 3
  max_message_length: 500
ai:
  provider: doubao
  model: ep-20251226192412-8kff2
  max_tokens: 1000
  temperature: 0.8
  max_context_messages: 20
personality:
  config_file: config/persona.yaml
filters:
  whitelist: []
  blacklist: []
  keywords_filter: []
logging:
  level: DEBUG
  file: logs/ailive.log
  rotation: 100 MB
  retention: 30 days
storage:
  conversations_dir: data/conversations
  cache_dir: data/cache

# 主动对话配置
proactive_chat:
  enabled: true              # 是否启用主动对话
  idle_time: 3600            # 闲置多久后主动聊天（秒），默认1小时
  min_interval: 1800         # 最小间隔时间（秒），默认30分钟
  max_daily_proactive: 3     # 每天最多主动几次

